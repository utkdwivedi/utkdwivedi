    <path d="M20 65L50 35L78 55L115 20L132 34"/>
    <circle cx="20" cy="65" r="5" fill="#58a6ff" stroke="none"/>
    <circle cx="50" cy="35" r="5" fill="#a78bfa" stroke="none"/>
    <circle cx="78" cy="55" r="5" fill="#a78bfa" stroke="none"/>
    <circle cx="115" cy="20" r="5" fill="#34d399" stroke="none"/>
    <circle cx="132" cy="34" r="5" fill="#34d399" stroke="none"/>
  </g>

  <rect x="0" y="0" width="1200" height="320" fill="none" stroke="#334155" stroke-width="2"/>

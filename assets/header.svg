<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Utkarsh Dwivedi — Simulation, ML, Systems</title>
  <desc id="desc">A dark technical banner for a software engineering profile.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <circle cx="980" cy="80" r="120" fill="#58a6ff" opacity="0.13" filter="url(#blur)"/>
  <circle cx="1080" cy="240" r="110" fill="#a78bfa" opacity="0.11" filter="url(#blur)"/>

  <g opacity="0.12" stroke="#94a3b8">
    <path d="M0 50H1200M0 100H1200M0 150H1200M0 200H1200M0 250H1200M0 300H1200"/>
    <path d="M50 0V320M100 0V320M150 0V320M200 0V320M250 0V320M300 0V320M350 0V320M400 0V320M450 0V320M500 0V320M550 0V320M600 0V320M650 0V320M700 0V320M750 0V320M800 0V320M850 0V320M900 0V320M950 0V320M1000 0V320M1050 0V320M1100 0V320M1150 0V320"/>
  </g>

  <g font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace">
    <text x="82" y="72" font-size="18" fill="#93a4bd">utkarsh@github:~$</text>
    <text x="82" y="118" font-size="42" font-weight="700" fill="#f8fafc">UTKARSH DWIVEDI</text>
    <rect x="82" y="142" width="650" height="3" rx="2" fill="url(#glow)"/>
    <text x="82" y="184" font-size="22" fill="#cbd5e1">SIMULATION  ×  MACHINE LEARNING  ×  SYSTEMS</text>
    <text x="82" y="222" font-size="16" fill="#94a3b8">build → measure → understand → optimize</text>
    <text x="82" y="278" font-size="14" fill="#64748b">Python • C++ • PyTorch • Numba • Kubernetes • Terraform • Linux</text>
  </g>

  <g transform="translate(900,120)" fill="none" stroke="url(#glow)" stroke-width="3" opacity="0.85">
